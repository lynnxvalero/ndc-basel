<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt | NDC Basel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,900;1,700;1,900&family=Syne:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <div id="header-root"></div>

  <main>
    <section class="section contact-section" style="padding-top:10rem" id="kontakt">
      <div class="container">
        <div class="contact-grid">
          <div class="contact-info">
            <p class="eyebrow" data-i18n="kontakt_eyebrow">Kontakt</p>
            <h2 data-i18n="kontakt_heading">Komm zu uns.</h2>
            <div class="contact-block">
              <span class="contact-label" data-i18n="kontakt_address">Adresse</span>
              <p>Zwingerstrasse 12<br>4053 Basel</p>
            </div>
            <div class="contact-block">
              <span class="contact-label" data-i18n="kontakt_phone">Telefon</span>
              <p><a href="tel:+41793207688">+41 79 320 76 88</a></p>
            </div>
            <div class="contact-block">
              <span class="contact-label" data-i18n="kontakt_email">E-Mail</span>
              <p><a href="mailto:jasminweder@magnet.ch">jasminweder@magnet.ch</a></p>
            </div>
          </div>
          <form class="contact-form" id="contactForm" novalidate>
            <div class="form-group">
              <label for="name" data-i18n="form_name">Name</label>
              <input type="text" id="name" name="name" required
                     data-i18n-placeholder="form_name_ph" placeholder="Dein Name">
            </div>
            <div class="form-group">
              <label for="email" data-i18n="form_email">E-Mail</label>
              <input type="email" id="email" name="email" required
                     data-i18n-placeholder="form_email_ph" placeholder="name@beispiel.ch">
            </div>
            <div class="form-group">
              <label for="interest" data-i18n="form_interest">Ich interessiere mich für</label>
              <input type="text" id="interest" name="interest"
                     data-i18n-placeholder="form_interest_ph"
                     placeholder="z.B. Teenie Hip Hop, Commercial, Probestunde …">
            </div>
            <div class="form-group">
              <label for="message" data-i18n="form_message">Nachricht</label>
              <textarea id="message" name="message" rows="5"
                        data-i18n-placeholder="form_msg_ph"
                        placeholder="Erzähl uns von dir oder deinem Kurswunsch"></textarea>
            </div>
            <button type="submit" class="btn-primary" data-i18n="form_submit">Nachricht senden</button>
            <p class="form-status" id="formStatus"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="scripts/data.js"></script>
  <script src="scripts/shared.js"></script>
  <script>
    initContactForm('contactForm', 'formStatus');
    initPage();
  </script>
</body>
</html>
