<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News | NDC Basel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&family=Barlow+Condensed:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <div id="header-root"></div>

  <main>

      </div>

    <section class="section news-section reveal">

      </div>

  </main>

  <div id="footer-root"></div>

  <script src="scripts/data.js"></script>
  <script src="scripts/shared.js"></script>
  <script src="scripts/news.js"></script>

</html>
