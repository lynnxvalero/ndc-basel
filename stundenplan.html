<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurse & Stundenplan | NDC Basel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <div id="header-root"></div>

  <main>
    <div class="page-hero">
      <div class="container">
        <p class="eyebrow" data-i18n="sp_eyebrow">Kursangebot & Wochenplan</p>
        <h1 data-i18n="sp_heading">Kurse & Stundenplan.</h1>
        <p class="page-hero-sub" data-i18n="sp_note">Alle Zeiten in MEZ · Änderungen vorbehalten</p>
        <br>
        <a href="Stundenplan-NDC_20260107.pdf" target="_blank" rel="noreferrer" class="btn-ghost" data-i18n="stundenplan_pdf">Als PDF herunterladen</a>
      </div>
    </div>

    <!-- ── KURSE NACH ALTERSGRUPPE ────────────────────────────── -->
    <section class="section reveal" id="kurse">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow" data-i18n="kurse_eyebrow">Kursangebot</p>
          <p class="section-sub" data-i18n="kurse_sub">Nach Altersgruppe organisiert. Echte Zeiten, echte Coaches.</p>
        </div>
        <div id="kurseContainer">
          <!-- populated by kurse.js -->
        </div>
      </div>
    </section>

    <!-- ── WOCHENPLAN ─────────────────────────────────────────── -->
    <section class="section stundenplan-page reveal" id="splan">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow" data-i18n="sp_plan_eyebrow">Wochenplan</p>
          <h2 data-i18n="sp_plan_heading">Alle Kurse auf einen Blick.</h2>
        </div>
        <div id="splanContainer">
          <!-- populated by stundenplan.js -->
        </div>
      </div>
    </section>

    <!-- ── EVENTS ─────────────────────────────────────────────── -->
    <section class="section events-section reveal" id="events">
      <div class="container">
        <div class="section-header">
          <p class="eyebrow" data-i18n="events_eyebrow">Events</p>
          <h2 data-i18n="events_heading">Auftritte & Workshops.</h2>
        </div>
        <div class="events-grid" id="eventsGrid">
          <!-- populated by stundenplan.js -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="scripts/data.js"></script>
  <script src="scripts/shared.js"></script>
  <script src="scripts/kurse.js"></script>
  <script src="scripts/stundenplan.js"></script>
</body>
</html>
